title = "App Security Doctor rules"
[extend]
useDefault = true
[[rules]]
id = "supabase-service-role"
description = "Potential Supabase service-role credential"
regex = '''(?i)(?:supabase[_-]?)?service[_-]?role(?:[_-]?key)?\s*[=:]\s*["']?([A-Za-z0-9._-]{30,})'''
secretGroup = 1
[[rules]]
id = "generic-jwt-secret"
description = "Potential hardcoded JWT secret"
regex = '''(?i)jwt[_-]?secret\s*[=:]\s*["']([^"'\s]{8,})'''
secretGroup = 1
