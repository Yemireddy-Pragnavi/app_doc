name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:domain
      - run: npx tsc --noEmit
      - run: npx next build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder-only
          APP_DOMAIN: staging.example.com
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      POSTGRES_PASSWORD: ephemeral-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start isolated test services
        run: docker compose up -d --build db redis api worker browser scheduler
      - name: Wait for worker
        run: |
          for attempt in $(seq 1 20); do
            if docker compose exec -T worker celery -A app.worker.celery inspect ping --timeout=3; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run actual scanners and isolated browser fixture
        run: docker compose exec -T worker python < backend/tests/stack_smoke.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 api worker browser
      - name: Remove ephemeral services
        if: always()
        run: docker compose down -v
